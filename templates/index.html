<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <title>Sistema de Producao</title>
</head>
<body>
    <div class="container_Principal">
        <aside class="barra_Menu">
            <div class="menu_Brand">
                <h2>Sistema Mecanica</h2>
                <p>Gestao de Telas de Visualizacao</p>
            </div>

            <p class="menu_SectionTitle">Telas</p>
            <ul id="equip-list" class="equip_List"></ul>
        </aside>
        
        <main class="informacoes_Equipamentos">
            <div id="equip-info" class="painel_Info">
                <h1>Painel de Telas</h1>
                <p>Selecione uma tela para configurar nome e enviar PDFs.</p>
            </div>
        </main>
    </div>

    <div id="equipment-modal" class="modal_Overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal_Box">
            <div class="modal_Header">
                <div>
                    <h2 id="modal-title">Configurar Tela</h2>
                    <p>Adicione, remova e organize os PDFs desta tela.</p>
                </div>
                <button id="close-modal" class="btn_CloseModal" type="button">X</button>
            </div>

            <form id="equipment-form" class="form_Equipamento">
                <label for="equipment-name">Nome da Tela</label>
                <input id="equipment-name" name="name" type="text" required />

                <label for="responsible-name">Nome do responsavel</label>
                <input id="responsible-name" name="responsible" type="text" />

                <label for="operation-type">Tipo de operacao</label>
                <input id="operation-type" name="operation_type" type="text" />

                <div class="tabs_Header">
                    <button type="button" class="tab_Btn active" data-tab="torno">PDFs</button>
                </div>

                <div id="tab-torno" class="tab_Panel active">
                    <div id="torno-dropzone" class="pdf_DropZone">
                        <input id="torno-pdfs" name="torno_pdfs" type="file" accept="application/pdf" multiple class="hidden_FileInput" />
                        <div class="pdf_DropZone_Content">
                            <span class="pdf_DropZone_Icon">&#128196;</span>
                            <p class="pdf_DropZone_Text">Arraste PDFs aqui ou <label for="torno-pdfs" class="pdf_DropZone_Link">clique para selecionar</label></p>
                            <p class="pdf_DropZone_Sub">Somente arquivos .pdf</p>
                        </div>
                    </div>
                    <div id="torno-preview" class="pdf_PreviewGrid"></div>
                </div>

                <div class="modal_Actions">
                    <button type="submit" class="btn_SubmitEquip">Salvar PDFs</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/index-page.js') }}"></script>
</body>
</html>
